<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいたんカード</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24344A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Architects+Daughter&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-dim:#F2ECDC;
    --ink:#24344A;
    --ink-soft:#5B6E85;
    --red:#C6432E;
    --red-soft:#E7C9C1;
    --mint:#5C9A80;
    --mint-soft:#D8E8DF;
    --line:#CBBE9C;
    --gold:#D9A441;
    --shadow: 0 10px 30px rgba(36,52,74,.18);
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(217,164,65,.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(92,154,128,.12), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Maru Gothic','Kosugi Maru',sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    max-width:720px; margin:0 auto;
    position:relative;
  }
  header.top{
    padding:18px 20px 10px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top h1{
    font-family:'Kosugi Maru',sans-serif;
    font-size:22px; margin:0; color:var(--ink);
    letter-spacing:.5px;
  }
  header.top h1 .dot{color:var(--red);}
  header.top .sub{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}

  main{flex:1; overflow-y:auto; padding:6px 18px 18px;}
  section.screen{display:none; animation:fadeUp .35s ease;}
  section.screen.active{display:block;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

  nav.tabs{
    display:flex; border-top:1px solid var(--line);
    background:var(--paper-dim);
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:12px 4px 14px;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:12.5px;
    color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer;
  }
  nav.tabs button .icon{font-size:19px;}
  nav.tabs button.active{color:var(--red);}
  nav.tabs button.active .icon{transform:translateY(-2px);}
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

  /* ---- shared card ---- */
  .card{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    position:relative; padding:22px 20px 20px; margin-top:16px;
    border:1px solid rgba(36,52,74,.06);
  }
  .card::before{
    content:"";
    position:absolute; top:-9px; left:24px; right:24px; height:18px;
    background-image: radial-gradient(circle, var(--paper) 6px, transparent 6.5px);
    background-size:26px 18px; background-repeat:repeat-x; background-position:0 0;
  }
  .card::after{
    content:"";
    position:absolute; top:-9px; left:24px; right:24px; height:18px;
    background-image: radial-gradient(circle, rgba(36,52,74,.10) 6px, transparent 7px);
    background-size:26px 18px; background-repeat:repeat-x; background-position:0 0;
    -webkit-mask-image: linear-gradient(90deg, black 1px, transparent 1px);
    mask-image: linear-gradient(90deg, black 1px, transparent 1px);
    -webkit-mask-size: 26px 18px; mask-size:26px 18px;
    opacity:0;
  }

  h2.section-title{font-size:15px; margin:18px 0 8px; color:var(--ink-soft); font-weight:700;}

  /* ---- manage screen ---- */
  .addrow{display:flex; gap:8px; margin-top:10px;}
  .addrow input{
    flex:1; padding:12px 12px; border-radius:12px; border:2px solid var(--line);
    background:var(--paper); font-family:'Zen Maru Gothic',sans-serif; font-size:15px; color:var(--ink);
  }
  .addrow input#in-en{font-family:'Architects Daughter',cursive; font-size:17px;}
  .btn{
    border:none; border-radius:12px; padding:11px 16px; font-weight:700; cursor:pointer;
    font-family:'Zen Maru Gothic',sans-serif; font-size:14px;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:active{transform:scale(.97);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:2px solid var(--line);}
  .btn-red{background:var(--red); color:#fff;}
  .btn-mint{background:var(--mint); color:#fff;}
  .btn-sm{padding:7px 10px; font-size:12px; border-radius:9px;}

  ul.wordlist{list-style:none; margin:12px 0 0; padding:0;}
  ul.wordlist li{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid rgba(36,52,74,.08); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; box-shadow:0 2px 6px rgba(36,52,74,.05);
  }
  ul.wordlist li .en{font-family:'Architects Daughter',cursive; font-size:18px; min-width:0; flex:0 1 auto;}
  ul.wordlist li .ja{color:var(--ink-soft); font-size:13px; flex:1;}
  ul.wordlist li .actions{display:flex; gap:6px;}
  .empty{
    text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;
    border:2px dashed var(--line); border-radius:14px; margin-top:14px;
  }
  .settings-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper-dim); border-radius:12px; padding:10px 14px; margin-top:14px;
    font-size:13px; color:var(--ink-soft); font-weight:700;
  }
  .switch{position:relative; width:42px; height:24px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .switch span{
    position:absolute; inset:0; background:var(--line); border-radius:20px; transition:.2s; cursor:pointer;
  }
  .switch span::before{
    content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + span{background:var(--mint);}
  .switch input:checked + span::before{transform:translateX(18px);}

  /* ---- practice / test flash card ---- */
  .stagebar{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .pager{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
    margin-top:16px;
  }
  .page-num{
    width:38px; height:38px; border-radius:50%; flex:none;
    border:2px solid var(--line); background:#fff;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:16px;
    color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .page-num.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .progress-pill{
    font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--paper-dim);
    padding:5px 10px; border-radius:20px; color:var(--ink-soft);
  }
  .streak{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); font-weight:700;}

  .flash{padding-top:30px; padding-bottom:24px; min-height:170px; text-align:center; perspective:800px;}
  .flash-inner{transition:transform .35s; transform-style:preserve-3d;}
  .flash.flip .flash-inner{transform:rotateY(360deg);}

  .speaker{
    width:52px; height:52px; border-radius:50%; border:none; background:var(--ink); color:#fff;
    font-size:22px; cursor:pointer; box-shadow:0 4px 10px rgba(36,52,74,.25); margin-bottom:6px;
  }
  .speaker:active{transform:scale(.94);}
  .ja-hint{color:var(--ink-soft); font-size:14px; margin:4px 0 14px; min-height:18px;}

  .ghost-word{
    font-family:'Architects Daughter',cursive; font-size:28px; letter-spacing:3px;
    color:rgba(36,52,74,.22); margin:4px 0 2px; min-height:34px; user-select:none;
  }
  .reveal-word{
    font-family:'Architects Daughter',cursive; font-size:32px; letter-spacing:2px;
    color:var(--ink); margin-top:16px; user-select:none;
  }

  /* ---- handwriting pads ---- */
  .practice-grid{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin-top:10px;
    flex:1; min-height:120px;
  }
  .pad-wrap{
    position:relative; width:94%; max-width:400px; margin:0 auto;
  }
  .practice-grid .pad-wrap{ flex:1; min-height:0; }
  .pad-wrap.pad-lg{ max-width:460px; }
  .pad-canvas{
    width:100%; display:block; touch-action:none; border-radius:16px;
    border:2px dashed var(--line); background:var(--paper-dim);
    background-repeat:no-repeat;
    background-image:
      linear-gradient(rgba(36,52,74,.14), rgba(36,52,74,.14)),
      linear-gradient(rgba(36,52,74,.14), rgba(36,52,74,.14)),
      linear-gradient(rgba(36,52,74,.14), rgba(36,52,74,.14));
    background-size: 100% 1px, 100% 1px, 100% 1px;
    background-position: 0 33%, 0 66%, 0 99%;
  }
  .practice-grid .pad-canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .pad-clear{
    position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
    border:none; background:rgba(255,255,255,.9); box-shadow:0 2px 6px rgba(36,52,74,.18);
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .pad-slot{ margin-top:14px; }

  /* れんしゅう画面は縦にはみ出さず、余白いっぱいに5枠が伸び縮みして収まる */
  #screen-practice.active{
    display:flex; flex-direction:column; height:100%; min-height:0;
  }
  #screen-practice .pager,
  #screen-practice .stagebar{ flex:none; }
  #screen-practice .card{
    flex:1; min-height:0; display:flex; flex-direction:column;
    padding-top:14px; padding-bottom:14px;
  }
  #screen-practice .flash{
    flex:1; min-height:0; display:flex; flex-direction:column;
  }
  #screen-practice .speaker,
  #screen-practice .ja-hint,
  #screen-practice .ghost-word{ flex:none; }
  #screen-practice .card-actions{ flex:none; margin-top:10px; }

  .feedback{min-height:26px; margin-top:12px; font-weight:700; font-size:14px;}
  .feedback.ok{color:var(--mint);}
  .feedback.ng{color:var(--red);}
  .shake{animation:shake .3s;}
  @keyframes shake{
    10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
  }

  .card-actions{display:flex; gap:10px; justify-content:center; margin-top:16px;}

  .done-screen{text-align:center; padding:40px 10px;}
  .done-screen .big{font-size:48px;}
  .done-screen h3{font-family:'Kosugi Maru',sans-serif; margin:8px 0 4px;}

  select{
    font-family:'Zen Maru Gothic',sans-serif; border-radius:10px; border:2px solid var(--line);
    padding:6px 8px; background:var(--paper); color:var(--ink); font-size:12px;
  }
  .hidden{display:none !important;}
  .tts-warning{
    margin:0 20px 8px; padding:10px 12px; background:#FBEAE6; color:var(--red);
    border:1px solid var(--red-soft); border-radius:10px; font-size:12px; font-weight:700;
    line-height:1.5;
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>えいたん<span class="dot">・</span>カード</h1>
    <div class="sub" id="wordcount">0 words</div>
  </header>
  <div class="tts-warning hidden" id="tts-warn"></div>

  <main>
    <!-- ============ 単語管理 ============ -->
    <section class="screen" id="screen-manage">
      <h2 class="section-title">単語をとうろく</h2>
      <div class="addrow">
        <input id="in-en" type="text" placeholder="英単語 (apple)" autocomplete="off">
      </div>
      <div class="addrow">
        <input id="in-ja" type="text" placeholder="意味・ヒント (りんご) ※省略可" autocomplete="off">
        <button class="btn btn-primary" id="btn-add">追加</button>
      </div>

      <h2 class="section-title">単語リスト</h2>
      <ul class="wordlist" id="wordlist"></ul>
      <div class="empty" id="empty-msg">まだ単語がありません。上のフォームから追加してね。</div>

      <div class="settings-row">
        <span>テストの合格ライン（連続正解）</span>
        <select id="mastery-select">
          <option value="1">1回</option>
          <option value="2" selected>2回</option>
          <option value="3">3回</option>
        </select>
      </div>
    </section>

    <!-- ============ 練習モード ============ -->
    <section class="screen" id="screen-practice">
      <div class="pager" id="practice-pager"></div>
      <div class="stagebar">
        <span class="progress-pill" id="practice-pill">0 / 0</span>
      </div>
      <div class="card">
        <div class="flash" id="practice-flash">
          <button class="speaker" id="practice-speak">🔊</button>
          <div class="ja-hint" id="practice-ja"></div>
          <div class="ghost-word" id="practice-ghost"></div>
          <div class="practice-grid" id="practice-grid"></div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" id="practice-clear">ぜんぶクリア</button>
          <button class="btn btn-ghost" id="practice-hint">ヒント</button>
          <button class="btn btn-mint" id="practice-skip">つぎの単語 ▶</button>
        </div>
      </div>
    </section>

    <!-- ============ テストモード ============ -->
    <section class="screen" id="screen-test">
      <div id="test-live">
        <div class="pager" id="test-pager"></div>
        <div class="stagebar">
          <span class="progress-pill" id="test-pill">0 / 0</span>
          <span class="streak" id="test-streak">streak 0</span>
          <button class="btn btn-ghost btn-sm" id="test-restart">🔄 さいしょから</button>
        </div>
        <div class="card">
          <div class="flash" id="test-flash">
            <button class="speaker" id="test-speak">🔊</button>
            <div class="ja-hint" id="test-ja"></div>
            <div class="pad-slot" id="test-pad-slot"></div>
            <div class="reveal-word hidden" id="test-reveal"></div>
            <div class="feedback" id="test-feedback"></div>
          </div>
          <div class="card-actions" id="test-actions-check">
            <button class="btn btn-red" id="test-reveal-btn">こたえをみる</button>
          </div>
          <div class="card-actions hidden" id="test-actions-grade">
            <button class="btn btn-ghost" id="test-grade-ng">✕ ちがった</button>
            <button class="btn btn-mint" id="test-grade-ok">◯ せいかい</button>
          </div>
        </div>
      </div>
      <div class="done-screen hidden" id="test-done">
        <div class="big">🎉</div>
        <h3>ぜんぶ せいかい！</h3>
        <p id="test-done-msg" style="color:var(--ink-soft); font-size:13px;"></p>
        <button class="btn btn-primary" id="test-again">もういちど テストする</button>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button data-screen="manage" class="active"><span class="icon">📇</span>単語帳</button>
    <button data-screen="practice"><span class="icon">✏️</span>れんしゅう</button>
    <button data-screen="test"><span class="icon">🎯</span>テスト</button>
  </nav>
</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "eitan_words_v1";
  const SETTINGS_KEY = "eitan_settings_v1";

  /* ---------- state ---------- */
  let words = loadWords();
  let settings = Object.assign({ mastery:2 }, loadSettings());

  function loadWords(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveWords(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); }
  function loadSettings(){
    try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- speech ---------- */
  let voices = [];
  function loadVoices(){ voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : []; }
  if ("speechSynthesis" in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  // Fully Kiosk Browser's own WebView does not implement the standard
  // Web Speech API at all — it exposes TTS through its own JS Interface
  // bridge instead (must be enabled in Fully's settings: "Enable
  // JavaScript Interface (PLUS)"). Use it when present.
  function hasFullyTts(){
    return !!(window.fully && typeof window.fully.textToSpeech === "function");
  }
  let currentSpokenText = null;
  let firstSpeakDone = false;
  function speakNow(text){
    const u = new SpeechSynthesisUtterance(text);
    const en = voices.find(v => /en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (en) u.voice = en;
    u.lang = en ? en.lang : "en-US";
    u.rate = 0.85;
    currentSpokenText = text;
    speechSynthesis.speak(u);
  }
  function speak(text){
    if (!text) return;
    if (hasFullyTts()){
      try { window.fully.textToSpeech(text); return; } catch (e){ /* fall through */ }
    }
    if (!("speechSynthesis" in window)) return;
    // Already saying this exact word — let it finish instead of
    // restarting (avoids an extra cancel/re-init round trip).
    if (speechSynthesis.speaking && currentSpokenText === text) return;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    if (!firstSpeakDone){
      // The very first utterance after a cold start (e.g. opening the
      // installed home-screen icon fresh, rather than an already-warm
      // Chrome tab) can need real time for Android to bind the TTS
      // engine — give it more headroom just this once.
      firstSpeakDone = true;
      setTimeout(() => speakNow(text), 350);
    } else {
      // Cancelling and speaking back-to-back can otherwise silently
      // drop audio, so give the engine a brief beat to reset.
      setTimeout(() => speakNow(text), 80);
    }
  }
  // Keep the TTS engine lightly "awake" in the background so presses
  // don't pay Android's engine cold-start cost. We deliberately do NOT
  // fire a synchronous "unlock" utterance on the very first tap anymore —
  // that raced against the real word being spoken on that same tap
  // (especially right after a cold start) and could cancel it into silence.
  let speechWarmLoopStarted = false;
  function startSpeechWarmLoop(){
    if (speechWarmLoopStarted || hasFullyTts() || !("speechSynthesis" in window)) return;
    speechWarmLoopStarted = true;
    setInterval(() => {
      if (!speechSynthesis.speaking && !speechSynthesis.pending){
        const ping = new SpeechSynthesisUtterance(" ");
        ping.volume = 0;
        speechSynthesis.speak(ping);
      }
    }, 12000);
  }
  document.addEventListener("pointerdown", startSpeechWarmLoop, { once: true });

  // If neither Fully's TTS bridge nor the Web Speech API is usable,
  // surface a hint instead of failing silently.
  function checkTtsHealth(){
    const warn = document.getElementById("tts-warn");
    if (!warn) return;
    if (hasFullyTts()) return; // Fully's own TTS bridge is available — nothing to warn about
    if (!("speechSynthesis" in window)){
      warn.textContent = "🔇 このブラウザは音声読み上げ(Web Speech API)に対応していません。Fully Kiosk Browserの場合は設定→「その他の設定」→「Webコンテンツ設定」内の「JavaScript Interfaceを有効化 (PLUS)」をONにすると、Fully独自の読み上げ機能が使えるようになります(PLUSライセンスが必要)。それ以外のKioskアプリなら、Chromeなど通常のブラウザで開いて動作するか確認してみてください。";
      warn.classList.remove("hidden");
      return;
    }
    setTimeout(() => {
      loadVoices();
      const hasEnglish = voices.some(v => /^en/i.test(v.lang));
      if (!hasEnglish){
        warn.textContent = "🔇 英語の音声データが見つかりません。設定 → システム → 言語と入力 → テキスト読み上げの出力 → Google音声合成エンジン →「英語(米国)」の音声データをダウンロードしてね(キーボードの言語パックとは別です)";
        warn.classList.remove("hidden");
      }
    }, 1800);
  }
  checkTtsHealth();


  /* ---------- tab navigation ---------- */
  const tabs = document.querySelectorAll("nav.tabs button");
  const screens = document.querySelectorAll("section.screen");
  tabs.forEach(btn => btn.addEventListener("click", () => {
    tabs.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const name = btn.dataset.screen;
    screens.forEach(s => s.classList.toggle("active", s.id === "screen-" + name));
    if (name === "practice") startPractice();
    if (name === "test") {
      requestAnimationFrame(() => testPad.resize());
      if (!testState.active) startTest();
    }
  }));
  document.getElementById("screen-manage").classList.add("active");

  /* ---------- manage screen ---------- */
  const listEl = document.getElementById("wordlist");
  const emptyMsg = document.getElementById("empty-msg");
  const wordcountEl = document.getElementById("wordcount");
  const inEn = document.getElementById("in-en");
  const inJa = document.getElementById("in-ja");
  let editingId = null;

  function renderList(){
    listEl.innerHTML = "";
    emptyMsg.classList.toggle("hidden", words.length > 0);
    wordcountEl.textContent = words.length + " words";
    words.forEach(w => {
      const li = document.createElement("li");
      li.innerHTML = `
        <span class="en">${escapeHtml(w.en)}</span>
        <span class="ja">${escapeHtml(w.ja || "")}</span>
        <span class="actions">
          <button class="btn btn-ghost btn-sm" data-act="speak" data-id="${w.id}">🔊</button>
          <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${w.id}">編集</button>
          <button class="btn btn-ghost btn-sm" data-act="del" data-id="${w.id}">削除</button>
        </span>`;
      listEl.appendChild(li);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  document.getElementById("btn-add").addEventListener("click", () => {
    const en = inEn.value.trim();
    const ja = inJa.value.trim();
    if (!en) { inEn.focus(); return; }
    if (editingId){
      const w = words.find(w => w.id === editingId);
      if (w){ w.en = en; w.ja = ja; }
      editingId = null;
      document.getElementById("btn-add").textContent = "追加";
    } else {
      words.push({ id: uid(), en, ja });
    }
    inEn.value = ""; inJa.value = ""; inEn.focus();
    saveWords(); renderList();
  });
  [inEn, inJa].forEach(el => el.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("btn-add").click();
  }));

  listEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    const w = words.find(w => w.id === id);
    if (!w) return;
    if (btn.dataset.act === "del"){
      words = words.filter(x => x.id !== id);
      saveWords(); renderList();
    } else if (btn.dataset.act === "edit"){
      inEn.value = w.en; inJa.value = w.ja || "";
      editingId = id;
      document.getElementById("btn-add").textContent = "更新";
      inEn.focus();
    } else if (btn.dataset.act === "speak"){
      speak(w.en);
    }
  });

  document.getElementById("mastery-select").value = String(settings.mastery);
  document.getElementById("mastery-select").addEventListener("change", e => {
    settings.mastery = parseInt(e.target.value, 10); saveSettings();
  });

  renderList();

  /* ---------- handwriting pad (canvas) ---------- */
  function makeWritingPad(heightPx, opts){
    opts = opts || {};
    const wrap = document.createElement("div");
    wrap.className = "pad-wrap" + (opts.large ? " pad-lg" : "");
    const canvas = document.createElement("canvas");
    canvas.className = "pad-canvas";
    // When heightPx is omitted, the canvas fills its wrap via CSS
    // (used for the practice pads, which flex-stretch to fit the
    // screen exactly instead of using a fixed pixel height).
    if (heightPx) canvas.style.height = heightPx + "px";
    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.className = "pad-clear";
    clearBtn.setAttribute("aria-label", "けす");
    clearBtn.textContent = "🧹";
    wrap.appendChild(canvas);
    wrap.appendChild(clearBtn);

    let drawing = false, last = null;
    function ctx(){ return canvas.getContext("2d"); }
    function resize(){
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const c = ctx();
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.scale(dpr, dpr);
      c.lineCap = "round";
      c.lineJoin = "round";
      c.lineWidth = 4;
      c.strokeStyle = "#C6432E";
    }
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    function start(e){
      drawing = true;
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}
      last = pos(e);
      e.preventDefault();
    }
    function move(e){
      if (!drawing) return;
      const p = pos(e);
      const c = ctx();
      c.beginPath();
      c.moveTo(last.x, last.y);
      c.lineTo(p.x, p.y);
      c.stroke();
      last = p;
      e.preventDefault();
    }
    function stop(){ drawing = false; last = null; }
    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointercancel", stop);
    canvas.addEventListener("pointerleave", stop);
    function clear(){ const c = ctx(); c.clearRect(0, 0, canvas.width, canvas.height); }
    clearBtn.addEventListener("click", clear);
    requestAnimationFrame(resize);
    window.addEventListener("resize", resize);
    return { el: wrap, clear, resize };
  }

  /* ---------- pagination (5 words per page) ---------- */
  const PAGE_SIZE = 5;
  function getPages(){
    const pages = [];
    for (let i = 0; i < words.length; i += PAGE_SIZE) pages.push(words.slice(i, i + PAGE_SIZE));
    if (!pages.length) pages.push([]);
    return pages;
  }
  const CIRCLED_NUMS = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
  function circledNum(n){ return CIRCLED_NUMS[n - 1] || String(n); }
  function renderPager(containerEl, pageCount, currentIndex, onSelect){
    containerEl.innerHTML = "";
    for (let i = 0; i < pageCount; i++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "page-num" + (i === currentIndex ? " active" : "");
      btn.textContent = circledNum(i + 1);
      btn.setAttribute("aria-label", (i + 1) + "ページ目");
      btn.addEventListener("click", () => onSelect(i));
      containerEl.appendChild(btn);
    }
  }

  /* ---------- practice mode ---------- */
  const PRACTICE_LINES = 5;
  const practiceEls = {
    pill: document.getElementById("practice-pill"),
    ja: document.getElementById("practice-ja"),
    ghost: document.getElementById("practice-ghost"),
    grid: document.getElementById("practice-grid"),
    flash: document.getElementById("practice-flash"),
    speakBtn: document.getElementById("practice-speak"),
    hintBtn: document.getElementById("practice-hint"),
    skipBtn: document.getElementById("practice-skip"),
    clearBtn: document.getElementById("practice-clear"),
    pager: document.getElementById("practice-pager"),
  };
  let practiceState = { order: [], idx: 0, current: null, hintShown: false, pageWords: [] };
  let practicePageIndex = 0;
  let practicePads = [];

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildPracticePads(){
    practiceEls.grid.innerHTML = "";
    practicePads = [];
    for (let i = 0; i < PRACTICE_LINES; i++){
      const pad = makeWritingPad(); // no fixed height — fills its share of the screen
      practiceEls.grid.appendChild(pad.el);
      practicePads.push(pad);
    }
  }

  function startPractice(){
    const pages = getPages();
    if (practicePageIndex >= pages.length) practicePageIndex = pages.length - 1;
    if (practicePageIndex < 0) practicePageIndex = 0;
    renderPager(practiceEls.pager, pages.length, practicePageIndex, (i) => {
      practicePageIndex = i;
      startPractice();
    });
    const pageWords = pages[practicePageIndex] || [];
    practiceState.pageWords = pageWords;
    if (!pageWords.length){
      practiceEls.pill.textContent = "0 / 0";
      practiceEls.ja.textContent = "";
      practiceEls.ghost.textContent = "";
      practiceEls.grid.innerHTML = "";
      practicePads = [];
      return;
    }
    practiceState.order = shuffle(pageWords);
    practiceState.idx = 0;
    showPracticeCard();
  }
  function showPracticeCard(){
    if (practiceState.idx >= practiceState.order.length) practiceState.order = shuffle(practiceState.pageWords);
    if (practiceState.idx >= practiceState.order.length) practiceState.idx = 0;
    const w = practiceState.order[practiceState.idx];
    practiceState.current = w;
    practiceState.hintShown = false;
    practiceEls.pill.textContent = (practiceState.idx + 1) + " / " + practiceState.order.length;
    practiceEls.ja.textContent = w.ja || "";
    practiceEls.ghost.textContent = "";
    practiceEls.hintBtn.textContent = "ヒント";
    buildPracticePads();
    speak(w.en);
  }
  practiceEls.hintBtn.addEventListener("click", () => {
    if (!practiceState.current) return;
    practiceState.hintShown = !practiceState.hintShown;
    practiceEls.ghost.textContent = practiceState.hintShown ? practiceState.current.en : "";
    practiceEls.hintBtn.textContent = practiceState.hintShown ? "ヒントをかくす" : "ヒント";
  });
  practiceEls.skipBtn.addEventListener("click", () => { practiceState.idx++; showPracticeCard(); });
  practiceEls.speakBtn.addEventListener("click", () => practiceState.current && speak(practiceState.current.en));
  practiceEls.clearBtn.addEventListener("click", () => practicePads.forEach(p => p.clear()));

  /* ---------- test mode (spaced repeat until mastered) ---------- */
  const testEls = {
    pill: document.getElementById("test-pill"),
    streak: document.getElementById("test-streak"),
    ja: document.getElementById("test-ja"),
    padSlot: document.getElementById("test-pad-slot"),
    reveal: document.getElementById("test-reveal"),
    feedback: document.getElementById("test-feedback"),
    flash: document.getElementById("test-flash"),
    speakBtn: document.getElementById("test-speak"),
    revealBtn: document.getElementById("test-reveal-btn"),
    gradeOkBtn: document.getElementById("test-grade-ok"),
    gradeNgBtn: document.getElementById("test-grade-ng"),
    checkGroup: document.getElementById("test-actions-check"),
    gradeGroup: document.getElementById("test-actions-grade"),
    restartBtn: document.getElementById("test-restart"),
    live: document.getElementById("test-live"),
    done: document.getElementById("test-done"),
    doneMsg: document.getElementById("test-done-msg"),
    againBtn: document.getElementById("test-again"),
    pager: document.getElementById("test-pager"),
  };
  let testState = { queue: [], progress: {}, total: 0, mastered: 0, streak: 0, current: null, active: false, misses: 0, pageWords: [] };
  let testPageIndex = 0;
  const testPad = makeWritingPad(220, { large: true });
  testEls.padSlot.appendChild(testPad.el);

  function startTest(){
    testEls.done.classList.add("hidden");
    testEls.live.classList.remove("hidden");
    testPad.clear();
    testEls.reveal.textContent = "";
    testEls.reveal.classList.add("hidden");
    testEls.checkGroup.classList.remove("hidden");
    testEls.gradeGroup.classList.add("hidden");
    const pages = getPages();
    if (testPageIndex >= pages.length) testPageIndex = pages.length - 1;
    if (testPageIndex < 0) testPageIndex = 0;
    renderPager(testEls.pager, pages.length, testPageIndex, (i) => {
      testPageIndex = i;
      startTest();
    });
    const pageWords = pages[testPageIndex] || [];
    testState.pageWords = pageWords;
    if (!pageWords.length){
      testEls.pill.textContent = "0 / 0";
      testEls.ja.textContent = "";
      testEls.feedback.textContent = "先に単語帳から単語を登録してね";
      testEls.feedback.className = "feedback";
      testState.active = false;
      return;
    }
    testState.queue = shuffle(pageWords);
    testState.progress = {};
    pageWords.forEach(w => testState.progress[w.id] = 0);
    testState.total = pageWords.length;
    testState.mastered = 0;
    testState.streak = 0;
    testState.misses = 0;
    testState.active = true;
    nextTestCard();
  }
  function masteredCount(){
    return Object.values(testState.progress).filter(v => v >= settings.mastery).length;
  }
  function nextTestCard(){
    testState.mastered = masteredCount();
    testEls.pill.textContent = testState.mastered + " / " + testState.total;
    testEls.streak.textContent = "streak " + testState.streak;

    if (testState.mastered >= testState.total){
      finishTest();
      return;
    }
    // find next word in queue that is not yet mastered
    let w = null;
    while (testState.queue.length){
      const cand = testState.queue.shift();
      if (testState.progress[cand.id] < settings.mastery){ w = cand; break; }
    }
    if (!w){
      // refill queue, weighting words that still need more correct answers
      const remaining = testState.pageWords.filter(x => testState.progress[x.id] < settings.mastery);
      testState.queue = shuffle(remaining.concat(remaining));
      w = testState.queue.shift();
    }
    testState.current = w;
    testEls.ja.textContent = w.ja || "";
    testEls.feedback.textContent = "";
    testEls.feedback.className = "feedback";
    testEls.reveal.textContent = "";
    testEls.reveal.classList.add("hidden");
    testEls.checkGroup.classList.remove("hidden");
    testEls.gradeGroup.classList.add("hidden");
    testPad.clear();
    speak(w.en);
  }
  testEls.revealBtn.addEventListener("click", () => {
    if (!testState.current || !testState.active) return;
    testEls.reveal.textContent = testState.current.en;
    testEls.reveal.classList.remove("hidden");
    testEls.checkGroup.classList.add("hidden");
    testEls.gradeGroup.classList.remove("hidden");
  });
  function gradeTest(correct){
    const w = testState.current;
    if (!w || !testState.active) return;
    if (correct){
      testState.progress[w.id] = (testState.progress[w.id] || 0) + 1;
      testState.streak++;
      testEls.feedback.textContent = "◯ よくできました！ (" + testState.progress[w.id] + "/" + settings.mastery + ")";
      testEls.feedback.className = "feedback ok";
    } else {
      testState.progress[w.id] = 0;
      testState.streak = 0;
      testState.misses++;
      testEls.feedback.textContent = "また あとで でるよ";
      testEls.feedback.className = "feedback ng";
      testEls.flash.classList.add("shake");
      setTimeout(() => testEls.flash.classList.remove("shake"), 300);
      // put it back a bit later in the queue
      const reinsertAt = Math.min(testState.queue.length, 2);
      testState.queue.splice(reinsertAt, 0, w);
    }
    testEls.checkGroup.classList.add("hidden");
    testEls.gradeGroup.classList.add("hidden");
    setTimeout(nextTestCard, correct ? 650 : 1200);
  }
  function finishTest(){
    testState.active = false;
    testEls.live.classList.add("hidden");
    testEls.done.classList.remove("hidden");
    testEls.doneMsg.textContent = testState.total + "語 マスター・まちがえた回数 " + testState.misses + "回";
  }
  testEls.gradeOkBtn.addEventListener("click", () => gradeTest(true));
  testEls.gradeNgBtn.addEventListener("click", () => gradeTest(false));
  testEls.restartBtn.addEventListener("click", startTest);
  testEls.againBtn.addEventListener("click", startTest);
  testEls.speakBtn.addEventListener("click", () => testState.current && speak(testState.current.en));

})();
</script>
</body>
</html>
